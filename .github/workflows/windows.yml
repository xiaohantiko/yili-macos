name: Build YiLi for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Windows/**
      - Sources/YiLiCore/SolarTermTable.swift
      - Sources/YiLiCore/Resources/fortune-contract.json
      - .github/workflows/windows.yml
  pull_request:
    paths:
      - Windows/**
      - Sources/YiLiCore/SolarTermTable.swift
      - Sources/YiLiCore/Resources/fortune-contract.json
      - .github/workflows/windows.yml

permissions:
  contents: read

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    defaults:
      run:
        working-directory: Windows
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Windows/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run package:win -- ${{ matrix.arch }}
      - name: Launch the archived app
        run: |
          $archive = Get-ChildItem ../dist/Windows/YiLi-*-Windows-${{ matrix.arch }}.zip
          $target = Join-Path $env:RUNNER_TEMP 'YiLi App'
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $target
          npm run smoke -- (Join-Path $target 'YiLi/YiLi.exe')
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: YiLi-Windows-${{ matrix.arch }}
          path: dist/Windows/YiLi-*-Windows-${{ matrix.arch }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
